name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        name: Test (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - name: Widget end-to-end test (real ALTCHA widget in Chrome)
              run: npm run test:widget
              env:
                  # Google Chrome is preinstalled on GitHub-hosted Ubuntu runners
                  CHROMIUM_PATH: /usr/bin/google-chrome
