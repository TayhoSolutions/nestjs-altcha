name: Release

# Publishes to npm when a version tag (e.g. v0.2.0) is pushed.
# Authentication uses npm trusted publishing (OIDC) – no npm token is stored in GitHub.
# Configure the trusted publisher on npmjs.com: owner "TayhoSolutions", repository "nestjs-altcha",
# workflow "release.yml".

on:
    push:
        tags: ["v*"]

permissions:
    contents: read
    id-token: write # required for OIDC (trusted publishing and provenance)

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false # never use caching in release builds
            - name: Ensure npm supports trusted publishing (>= 11.5.1)
              run: npm install -g npm@^11.5.1
            - run: npm ci
            - name: Check that the tag matches package.json
              run: |
                  VERSION="v$(node -p "require('./package.json').version")"
                  if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
                    echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
                    exit 1
                  fi
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - name: Publish to npm (with provenance)
              run: npm publish
